<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ccc9c1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Surface Depth Demo</title>
</head>
<body>
  <main id="stage" aria-label="凹み空間の光と影"><canvas id="view"></canvas></main>
  <button id="settings" aria-label="調整を開く" aria-expanded="false" aria-controls="panel">調整</button>
  <section id="panel" aria-label="凹みと光の調整" hidden>
    <header><div><span class="eyebrow">SURFACE DEPTH DEMO</span><h1>凹みと光</h1></div><button id="close" aria-label="調整を閉じる">×</button></header>
    <label>MainLayerの開き量 <output id="openingValue"></output><input id="opening" type="range" min="0" max="100" value="50" step="1"></label>
    <p class="footnote">0%で白い面が全画面を覆い、100%でAILayerが全面に見えます。割合は画面の高さに対する上昇量です。</p>
    <label class="toggle"><input id="mainShadows" type="checkbox" checked>MainLayerの影</label>
    <svg id="section" viewBox="0 0 300 100" role="img" aria-label="側壁と底面の断面図"><path id="profile"/><path class="datum" d="M16 18 H284"/><text x="150" y="12" text-anchor="middle">開口面</text><text id="dimensions" x="150" y="94" text-anchor="middle"></text></svg>
    <label>凹みの深さ <output id="depthValue"></output><input id="depth" type="range" min="1" max="30" value="20" step="0.5"></label>
    <label>底の角のR <output id="radiusValue"></output><input id="radius" type="range" min="0" max="20" value="20" step="0.25"></label>
    <div class="rule"></div>
    <label class="toggle"><input id="shadows" type="checkbox">筐体の影</label>
    <label>ベース色 <output id="baseColorValue"></output><input id="baseColor" type="color" value="#5c5c5c"></label>
    <p class="footnote">筐体の影がOFFでも、面の向きによる明暗は残ります。MainLayerの影は独立して切り替えられ、光源が大きいほど柔らかくなります。</p>
    <label>光源の左右 <output id="azimuthValue"></output><input id="azimuth" type="range" min="-180" max="180" value="0" step="1"></label>
    <label>光源の高さ <output id="elevationValue"></output><input id="elevation" type="range" min="15" max="90" value="60" step="1"></label>
    <label>光源の大きさ <output id="sizeValue"></output><input id="size" type="range" min="0" max="60" value="18" step="1"></label>
    <div class="actions"><button id="motion">傾きを使う</button><button id="calibrate" disabled>今の姿勢を基準に</button></div>
    <button id="reset" class="quiet">初期値に戻す</button>
    <p id="status" role="status">光源の向きを固定して比較できます。</p>
    <p class="footnote">深さ・R・光源サイズは画面短辺に対する割合。画面をドラッグして光の向きも調整できます。</p>
    <details><summary>実機確認</summary><p id="diagnostics"></p><p>iPhoneではSafariの共有からホーム画面に追加し、追加したアイコンから開いてください。</p></details>
  </section>
  <p id="error" role="alert" hidden></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
